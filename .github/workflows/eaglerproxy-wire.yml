name: Wire EaglerProxy into client

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eaglerproxy-wire.yml"
      - "EAGLERPROXY.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch Minecraft_1.8.html
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Minecraft_1.8.html")
          s = p.read_text(encoding="utf-8")
          marker = "/* AV1ZANDUM EaglerProxy integration */"
          needle = "window.eaglercraftXOptsHints = {"

          block = r'''/* AV1ZANDUM EaglerProxy integration */
          const eaglerProxyQuery = new URLSearchParams(window.location.search).get("proxy");
          const eaglerProxyURL = eaglerProxyQuery || (
              window.location.protocol === "http:" ? "ws://127.0.0.1:8080/" : null
          );

          window.eaglercraftXOpts = {
              demoMode: false,
              container: "game_frame",
              assetsURI: "assets.epk",
              localesURI: "lang/",
              worldsDB: "worlds",
              servers: eaglerProxyURL ? [
                  { addr: eaglerProxyURL, name: "AV1ZANDUM EaglerProxy" }
              ] : [],
              relays: [
                  { addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId === 0 },
                  { addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId === 1 },
                  { addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId === 2 }
              ],
              checkRelaysForUpdates: true
          };

          '''

          if needle not in s:
              raise SystemExit("Eaglercraft launch-options marker not found")

          if marker in s:
              start = s.index(marker)
              end = s.index(needle, start)
              s = s[:start] + block + s[end:]
          else:
              s = s.replace(needle, block + needle, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Verify patched client
        run: |
          grep -q 'AV1ZANDUM EaglerProxy' Minecraft_1.8.html
          grep -q 'eaglerProxyQuery' Minecraft_1.8.html
          grep -q 'window.eaglercraftXOpts' Minecraft_1.8.html
          test "$(wc -c < Minecraft_1.8.html)" -gt 17000000

      - name: Commit patched client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Minecraft_1.8.html
          if git diff --cached --quiet; then
            echo "Client already patched."
          else
            git commit -m "Add EaglerProxy support to Minecraft 1.8 [skip ci]"
            git push origin HEAD:main
          fi
