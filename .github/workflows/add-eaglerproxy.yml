name: Add EaglerProxy support

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-eaglerproxy.yml"

permissions:
  contents: write

jobs:
  patch-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Minecraft_1.8.html
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Minecraft_1.8.html")
          data = path.read_text(encoding="utf-8")

          if "const eaglerProxyAddress" in data:
              print("EaglerProxy support is already present.")
              raise SystemExit(0)

          marker = "window.eaglercraftXOptsHints = {"
          start = data.find(marker)
          if start < 0:
              raise SystemExit("Could not find Eaglercraft launch options.")

          end = data.find("};", start)
          if end < 0:
              raise SystemExit("Could not find end of Eaglercraft launch options.")

          insertion = r'''
          
          // EaglerProxy integration.
          // Local default: run EaglerProxy on 127.0.0.1:8080.
          // A hosted proxy can be selected with:
          // ?eaglerproxy=wss://YOUR-PROXY-HOST/
          const eaglerProxyParam = new URLSearchParams(window.location.search).get("eaglerproxy");
          const eaglerProxyAddress = eaglerProxyParam || "ws://127.0.0.1:8080/";

          window.eaglercraftXOpts = {
            container: "game_frame",
            worldsDB: "worlds",
            servers: [
              {
                name: "EaglerProxy",
                addr: eaglerProxyAddress
              }
            ]
          };'''

          data = data[:end + 2] + insertion + data[end + 2:]
          path.write_text(data, encoding="utf-8")
          print("EaglerProxy support added.")
          PY

      - name: Verify patch
        run: |
          grep -q 'const eaglerProxyAddress' Minecraft_1.8.html
          grep -q 'name: "EaglerProxy"' Minecraft_1.8.html
          grep -q 'addr: eaglerProxyAddress' Minecraft_1.8.html
          echo "EaglerProxy integration verified."

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Minecraft_1.8.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add EaglerProxy support to Minecraft client [skip proxy patch]"
            git push
          fi
